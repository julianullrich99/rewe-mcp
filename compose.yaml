# rewe-mcp – Stack für Docker Compose, Dockge, Portainer & Co.
# Ein Ordner mit dieser Datei und einer .env genügt, der Code wird direkt aus GitHub gebaut.
# Mit Traefik: compose.traefik.yaml verwenden.
name: rewe-mcp

services:
  rewe-mcp:
    build:
      context: https://github.com/julianullrich99/rewe-mcp.git#main:server
    image: rewe-mcp:latest
    restart: unless-stopped
    ports:
      - "47823:47823"   # MCP, OAuth, /health
      - "6080:6080"     # noVNC: REWE-Login im Server-Browser (nur im Heimnetz!)
    environment:
      REWE_MCP_PASSWORD: ${REWE_MCP_PASSWORD:?REWE_MCP_PASSWORD in .env setzen}
      REWE_VNC_PASSWORD: ${REWE_VNC_PASSWORD:?REWE_VNC_PASSWORD in .env setzen}
      REWE_LOGIN_URL: ${REWE_LOGIN_URL:-http://localhost:6080/vnc.html}
      REWE_PUBLIC_URL: ${REWE_PUBLIC_URL:-}   # öffentliche HTTPS-Adresse → aktiviert OAuth (claude.ai)
      REWE_KEEPALIVE_MIN: ${REWE_KEEPALIVE_MIN:-4}
      REWE_MCP_DEBUG: ${REWE_MCP_DEBUG:-0}
    volumes:
      - rewe-profile:/data  # Chrome-Profil inkl. REWE-Anmeldung + OAuth-Tokens
    shm_size: "1gb"         # Chrome braucht mehr Shared Memory als Dockers Standard
    init: true              # räumt beendete Chrome-Prozesse auf

  # Optional: Zugang aus dem Internet über Cloudflare Tunnel (COMPOSE_PROFILES=tunnel in .env)
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - rewe-mcp
    profiles: ["tunnel"]

volumes:
  rewe-profile:
